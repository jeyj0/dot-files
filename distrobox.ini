[ubuntu]
image=ghcr.io/ublue-os/ubuntu-toolbox
additional_packages="fonts-cascadia-code fonts-noto-color-emoji"
additional_packages="libfuse2"
home="/var/home/jeyj0"
volume="/nix:/nix"
nvidia=true
pre_init_hooks="export SHELL=/var/home/jeyj0/.nix-profile/bin/fish;"

[canos-playwright]
image=mcr.microsoft.com/playwright:v1.55.0-noble
home="/var/home/jeyj0"
volume="/nix:/nix"
pre_init_hooks="export SHELL=/var/home/jeyj0/.nix-profile/bin/fish;"
init_hooks="export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=true;"
